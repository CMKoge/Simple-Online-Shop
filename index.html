<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-store me-2"></i>Product Catalog
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">
                    <i class="fas fa-box me-1"></i>
                    <span id="product-count">0</span> Products
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-4">
        <!-- Filters Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="row g-3">
                            <!-- Search -->
                            <div class="col-md-4">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-search"></i>
                                    </span>
                                    <input type="text" class="form-control" id="search-input" 
                                           placeholder="Search products...">
                                </div>
                            </div>
                            
                            <!-- Category Filter -->
                            <div class="col-md-3">
                                <select class="form-select" id="category-filter">
                                    <option value="">All Categories</option>
                                </select>
                            </div>
                            
                            <!-- Sort -->
                            <div class="col-md-3">
                                <select class="form-select" id="sort-select">
                                    <option value="name">Sort by Name</option>
                                    <option value="price-low">Price: Low to High</option>
                                    <option value="price-high">Price: High to Low</option>
                                    <option value="id">Sort by ID</option>
                                </select>
                            </div>
                            
                            <!-- Stock Filter -->
                            <div class="col-md-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="stock-filter">
                                    <label class="form-check-label" for="stock-filter">
                                        In Stock Only
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Price Range Filter -->
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label for="price-range" class="form-label">
                                    Price Range: <span id="price-range-label">$0 - $1000</span>
                                </label>
                                <div class="price-range-container">
                                    <input type="range" class="form-range" id="price-range-min" 
                                           min="0" max="1000" value="0">
                                    <input type="range" class="form-range" id="price-range-max" 
                                           min="0" max="1000" value="1000">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-5" style="display: none;">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Loading products...</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="alert alert-danger" style="display: none;" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span id="error-text"></span>
        </div>

        <!-- Products Grid -->
        <div id="products-container">
            <div id="products-grid" class="row g-4"></div>
            
            <!-- No Products Message -->
            <div id="no-products" class="text-center py-5" style="display: none;">
                <i class="fas fa-box-open text-muted" style="font-size: 4rem;"></i>
                <h4 class="mt-3 text-muted">No products found</h4>
                <p class="text-muted">Try adjusting your search criteria</p>
            </div>
        </div>

        <!-- Pagination -->
        <nav aria-label="Products pagination" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>

    <!-- Order Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="orderModalLabel">
                        <i class="fas fa-shopping-cart me-2"></i>Place Order
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-5">
                            <img id="modal-product-image" src="" alt="" class="img-fluid rounded">
                        </div>
                        <div class="col-md-7">
                            <h5 id="modal-product-name" class="mb-3"></h5>
                            <div class="product-details mb-3">
                                <p class="mb-2"><strong>Product ID:</strong> <span id="modal-product-id"></span></p>
                                <p class="mb-2"><strong>Category:</strong> <span id="modal-product-category"></span></p>
                                <p class="mb-3"><span id="modal-product-description"></span></p>
                                
                                <div class="price-section mb-4">
                                    <div id="modal-price-display" class="h4"></div>
                                </div>
                                
                                <div class="quantity-section mb-4">
                                    <label class="form-label"><strong>Quantity:</strong></label>
                                    <div class="input-group quantity-input" style="max-width: 150px;">
                                        <button class="btn btn-outline-secondary" type="button" id="quantity-decrease">
                                            <i class="fas fa-minus"></i>
                                        </button>
                                        <input type="number" class="form-control text-center" id="quantity-input" 
                                               value="1" min="1" max="99">
                                        <button class="btn btn-outline-secondary" type="button" id="quantity-increase">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="total-section mb-4">
                                    <div class="h5">Total: <span id="modal-total-price" class="text-primary"></span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" id="whatsapp-order-btn">
                        <i class="fab fa-whatsapp me-2"></i>Order via WhatsApp
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
